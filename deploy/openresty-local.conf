# Local HTTP staging only. No TLS or public listener. Replace test hosts only
# together with supplier_portal.host/origin and a reviewed HTTPS deployment.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /usr/local/openresty/nginx/conf/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off; # Never log request bodies, query strings, or credentials.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 1m;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Replace, rather than trust, client-supplied forwarding headers.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 3s;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  proxy_buffering off;
  proxy_cache off;
  proxy_next_upstream off;

  server {
    listen 8080 default_server;
    server_name _;
    return 404;
  }
  server {
    listen 8080;
    server_name consumer.example.test;
    root /srv/consumer;
    location = /api { proxy_pass http://172.31.16.78:18081; }
    location ^~ /api/ { proxy_pass http://172.31.16.78:18081; }
    location / { try_files $uri $uri/ /index.html; }
  }
  server {
    listen 8080;
    server_name gateway.example.test;
    location / { proxy_pass http://172.31.16.78:18080; }
  }
  server {
    listen 8080;
    server_name supplier.example.test;
    root /srv/supplier;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    # Dedicated supplier Control is not deployed yet. Never fall back to the
    # ordinary Control port. HTTPS is mandatory in the supplier backend config.
    location = /api { proxy_pass http://host.docker.internal:18082; }
    location ^~ /api/ { proxy_pass http://host.docker.internal:18082; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
