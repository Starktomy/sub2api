worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
 include /usr/local/openresty/nginx/conf/mime.types;
 default_type application/octet-stream;
 server_tokens off;
 access_log off;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 client_max_body_size 1m;
 proxy_http_version 1.1;
 proxy_set_header Connection "";
 proxy_set_header Host $host;
 proxy_set_header X-Real-IP $remote_addr;
 proxy_set_header X-Forwarded-For $remote_addr;
 proxy_set_header X-Forwarded-Proto https;
 proxy_set_header X-Forwarded-Host $host;
 proxy_connect_timeout 3s;
 proxy_read_timeout 300s;
 proxy_send_timeout 300s;
 proxy_buffering off;
 proxy_cache off;
 proxy_next_upstream off;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_tickets off;
 ssl_certificate /run/tls/fullchain.pem;
 ssl_certificate_key /run/tls/privkey.pem;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control no-store always;
 server { listen 8080 default_server; server_name _; return 404; }
 server {
  listen 8080;
  server_name app.aquawhale.net api.aquawhale.net admin.aquawhale.net supplier.aquawhale.net;
  location ^~ /.well-known/acme-challenge/ { root /srv/acme; default_type text/plain; }
  location / { return 308 https://$host$request_uri; }
 }
 server { listen 8443 ssl default_server; server_name _; ssl_reject_handshake on; }
 server {
  listen 8443 ssl;
  server_name app.aquawhale.net;
  root /srv/consumer;
  location = /api { return 404; }
  location ^~ /api/v1/admin { return 404; }
  location ^~ /api/v1/supplier { return 404; }
  location ^~ /api/v1/mcp { return 404; }
  location ^~ /api/ { proxy_pass http://172.31.16.78:18081; }
  location / { try_files $uri $uri/ /index.html; }
 }
 server {
  listen 8443 ssl;
  server_name admin.aquawhale.net;
  root /srv/consumer;
  location ^~ /api/v1/admin/ { proxy_pass http://172.31.16.78:18081; }
  location ^~ /api/v1/auth/ { proxy_pass http://172.31.16.78:18081; }
  location = /api/v1/settings/public { proxy_pass http://172.31.16.78:18081; }
  location = /api { return 404; }
  location /api/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
 }
 server {
  listen 8443 ssl;
  server_name api.aquawhale.net;
  client_max_body_size 32m;
  location / { proxy_pass http://172.31.16.78:18080; }
 }
 server {
  listen 8443 ssl;
  server_name supplier.aquawhale.net;
  root /srv/supplier;
  location = /v1 { return 404; }
  location ^~ /v1/ { return 404; }
  location = /v1beta { return 404; }
  location ^~ /v1beta/ { return 404; }
  # Only the dedicated supplier Control may receive supplier credentials.
  location = /api { proxy_pass http://172.31.16.78:18082; }
  location ^~ /api/ { proxy_pass http://172.31.16.78:18082; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
